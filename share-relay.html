<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分享名片</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0f; --text:#f5f7f8; --text-dim:#9aa4ac;
    --accent:#06C755; --danger:#ff5c72;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #wrap{
    width:100%; max-width:340px; padding:32px 28px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:16px;
  }
  .spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.12); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .icon-circle{
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-circle.success{ background:rgba(6,199,85,0.15); }
  .icon-circle.info{ background:rgba(255,255,255,0.08); }
  .icon-circle.danger{ background:rgba(255,92,114,0.15); }
  .icon-circle svg{ width:26px; height:26px; }
  h1{ font-family:'Manrope',sans-serif; font-weight:800; font-size:17px; margin:0; }
  p{ font-size:13.5px; line-height:1.6; color:var(--text-dim); margin:0; }
  .btn-row{ display:flex; gap:8px; width:100%; margin-top:6px; }
  button{
    flex:1; padding:12px 16px; border-radius:12px; font-size:13.5px; font-weight:700;
    border:1px solid transparent; cursor:pointer; font-family:inherit;
  }
  button.primary{ background:var(--accent); color:#04220f; }
  button.secondary{ background:rgba(255,255,255,0.07); color:var(--text); border-color:rgba(255,255,255,0.14); }
</style>
</head>
<body>
  <div id="wrap">
    <div class="spinner" id="spinner"></div>
    <div id="icon-slot"></div>
    <h1 id="title">正在準備名片…</h1>
    <p id="desc">請稍候，即將開啟好友選擇畫面。</p>
    <div class="btn-row" id="btn-row" style="display:none;"></div>
  </div>

<script>
  // 站長設定：申請好新的分享用 LIFF App 之後，把 ID 貼在這裡（記得該 LIFF 需勾選 chat_message.write 這個 Scope）
  const LIFF_ID = "2010822462-4rMfw51B";

  const qs = new URLSearchParams(location.search);
  const dataUrl = qs.get("data");

  const el = {
    spinner: document.getElementById("spinner"),
    iconSlot: document.getElementById("icon-slot"),
    title: document.getElementById("title"),
    desc: document.getElementById("desc"),
    btnRow: document.getElementById("btn-row")
  };

  function showState(kind, title, desc, buttons) {
    el.spinner.style.display = kind === "loading" ? "block" : "none";
    el.iconSlot.innerHTML = "";
    if (kind !== "loading") {
      const icons = {
        success: '<div class="icon-circle success"><svg viewBox="0 0 24 24" fill="none" stroke="#06C755" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>',
        info: '<div class="icon-circle info"><svg viewBox="0 0 24 24" fill="none" stroke="#f5f7f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>',
        danger: '<div class="icon-circle danger"><svg viewBox="0 0 24 24" fill="none" stroke="#ff5c72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div>'
      };
      el.iconSlot.innerHTML = icons[kind] || icons.info;
    }
    el.title.innerText = title;
    el.desc.innerText = desc;
    if (buttons && buttons.length) {
      el.btnRow.style.display = "flex";
      el.btnRow.innerHTML = "";
      buttons.forEach(b => {
        const btn = document.createElement("button");
        btn.className = b.style || "secondary";
        btn.innerText = b.label;
        btn.onclick = b.onClick;
        el.btnRow.appendChild(btn);
      });
    } else {
      el.btnRow.style.display = "none";
    }
  }

  function closePage() {
    if (window.liff && liff.isInClient && liff.isInClient()) {
      liff.closeWindow();
    } else {
      history.back();
    }
  }

  async function run() {
    if (!dataUrl) {
      showState("loading", "分享中，請稍候…", "正在準備名片內容。");
      // Safety net: if there's genuinely no data param, nothing will ever
      // resolve this "loading" state — show a way out after a short wait
      // instead of leaving the person stuck here forever.
      setTimeout(() => {
        if (!dataUrl) {
          showState("info", "無法載入名片內容", "這個頁面需要從名片的分享按鈕點擊進入，才能帶入正確的名片資料。", [
            { label: "關閉", style: "secondary", onClick: closePage }
          ]);
        }
      }, 4000);
      return;
    }

    try {
      await liff.init({ liffId: LIFF_ID });
    } catch (err) {
      showState("danger", "初始化失敗", "無法連接 LINE 服務，請稍後再試一次。", [
        { label: "重試", style: "primary", onClick: run },
        { label: "關閉", style: "secondary", onClick: closePage }
      ]);
      return;
    }

    if (!liff.isLoggedIn()) {
      showState("loading", "正在登入…", "請稍候。");
      liff.login();
      return;
    }

    let flexMessage;
    try {
      const res = await fetch(dataUrl, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      flexMessage = await res.json();
    } catch (err) {
      showState("danger", "讀取名片資料失敗", "無法取得最新的名片內容，請確認名片檔案是否已正確上傳，或稍後再試。", [
        { label: "重試", style: "primary", onClick: run },
        { label: "關閉", style: "secondary", onClick: closePage }
      ]);
      return;
    }

    if (!liff.isApiAvailable('shareTargetPicker')) {
      showState("danger", "無法使用分享功能", "請在 LINE App 內開啟這個頁面才能選擇好友分享。", [
        { label: "關閉", style: "secondary", onClick: closePage }
      ]);
      return;
    }

    showState("loading", "正在開啟好友選擇畫面…", "請選擇要分享的好友或群組。");

    try {
      const result = await liff.shareTargetPicker([flexMessage]);
      if (result) {
        showState("success", "已成功分享！", "名片已經傳送出去了，這個視窗即將自動關閉。");
        setTimeout(closePage, 1400);
      } else {
        showState("info", "已取消分享", "你可以再試一次，或直接關閉這個視窗。", [
          { label: "再選一次", style: "primary", onClick: run },
          { label: "關閉", style: "secondary", onClick: closePage }
        ]);
      }
    } catch (err) {
      showState("danger", "分享失敗", "發生問題，請稍後再試一次。", [
        { label: "重試", style: "primary", onClick: run },
        { label: "關閉", style: "secondary", onClick: closePage }
      ]);
    }
  }

  run();
</script>
</body>
</html>
